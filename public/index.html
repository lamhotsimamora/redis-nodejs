<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CRUD Users Vue2 + Tailwind + Redis API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
  <div id="app" class="max-w-4xl mx-auto">
    <header class="mb-6">
      <h1 class="text-2xl font-semibold text-slate-800">CRUD Users (Vue 2 + Redis API)</h1>
      <p class="text-sm text-slate-600">Frontend sederhana dengan Vue.js 2</p>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white shadow-sm rounded-lg p-4">
        <h2 class="text-lg font-medium mb-3">Form User</h2>
        <form @submit.prevent="saveUser" class="space-y-3">
          <div>
            <label class="block text-sm font-medium text-slate-700">Nama</label>
            <input v-model="form.name" type="text" required class="mt-1 block w-full border rounded-md px-3 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input v-model="form.email" type="email" required class="mt-1 block w-full border rounded-md px-3 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Umur</label>
            <input v-model="form.age" type="number" class="mt-1 block w-full border rounded-md px-3 py-2" />
          </div>
          <div class="flex gap-2">
            <button class="bg-sky-600 text-white px-4 py-2 rounded">{{ isEdit ? 'Update' : 'Simpan' }}</button>
            <button type="button" @click="resetForm" class="bg-slate-200 px-4 py-2 rounded">Batal</button>
          </div>
        </form>
      </div>

      <div class="bg-white shadow-sm rounded-lg p-4 overflow-auto">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-medium">Daftar Users</h2>
          <button @click="loadUsers" class="text-sm bg-slate-100 px-3 py-1 rounded">Refresh</button>
        </div>
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left text-slate-600">
              <th class="py-2">ID</th>
              <th class="py-2">Nama</th>
              <th class="py-2">Email</th>
              <th class="py-2">Umur</th>
              <th class="py-2">Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="user in users" :key="user.id" class="divide-y">
              <td class="py-2 font-mono">{{ user.id }}</td>
              <td class="py-2">{{ user.name }}</td>
              <td class="py-2">{{ user.email }}</td>
              <td class="py-2">{{ user.age }}</td>
              <td class="py-2">
                <button @click="editUser(user)" class="text-sm mr-2 underline">Edit</button>
                <button @click="deleteUser(user.id)" class="text-sm text-red-600 underline">Hapus</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-if="users.length === 0" class="text-center text-slate-500 py-6">Belum ada user.</div>
      </div>
    </section>
  </div>

<script>
new Vue({
  el: '#app',
  data: {
    API_BASE: 'http://localhost:3333',
    users: [],
    form: { id: '', name: '', email: '', age: '' },
    isEdit: false
  },
  methods: {
    async loadUsers() {
      const res = await fetch(this.API_BASE + '/users');
      const data = await res.json();
      this.users = data.users || data;
    },
    async saveUser() {
      const payload = { name: this.form.name, email: this.form.email, age: Number(this.form.age) };
      if (this.isEdit) {
        await fetch(this.API_BASE + '/users/' + this.form.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      } else {
        await fetch(this.API_BASE + '/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      }
      this.resetForm();
      this.loadUsers();
    },
    editUser(user) {
      this.form = { ...user };
      this.isEdit = true;
    },
    async deleteUser(id) {
      if (confirm('Hapus user ID ' + id + '?')) {
        await fetch(this.API_BASE + '/users/' + id, { method: 'DELETE' });
        this.loadUsers();
      }
    },
    resetForm() {
      this.form = { id: '', name: '', email: '', age: '' };
      this.isEdit = false;
    }
  },
  created() {
    this.loadUsers();
  }
});
</script>
</body>
</html>
